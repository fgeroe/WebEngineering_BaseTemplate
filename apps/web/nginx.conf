server {
  listen 80;
  root /usr/share/nginx/html;

  # The API answers with its own security headers (@fastify/helmet).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Security headers for the React app itself: helmet's CSP only covers API
  # responses, the HTML page comes from here. Kept in this location because
  # nginx drops server-level add_header in any location with its own.
  # CSP: scripts only from this origin (no inline scripts, so a stored XSS
  # payload cannot run even if it reached the DOM), API calls only to this
  # origin, images also from Wikimedia, fonts from Google Fonts.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
