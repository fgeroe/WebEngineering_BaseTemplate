root: true
env:
  browser: true
  es2022: true
parserOptions:
  project: ./tsconfig.json
settings:
  react:
    version: detect
extends:
  - standard-with-typescript
  - plugin:@typescript-eslint/recommended
  - plugin:react/recommended
  - plugin:react/jsx-runtime
  - plugin:react-hooks/recommended
  - plugin:prettier/recommended
  - prettier
ignorePatterns:
  - dist
  - node_modules
