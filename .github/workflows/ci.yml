name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example (no secrets in git)
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Smoke test
        run: |
          curl --fail --include http://localhost:3000/health
          curl --fail --include http://localhost:3000/health/ready
          curl --fail --silent http://localhost:3000/api/bears | head -c 300
          curl --fail --silent --output /dev/null http://localhost:8080/

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the commits of the push / pull request

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
